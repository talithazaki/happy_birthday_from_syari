<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaksi Spesial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #240b4c 0%, #0d041d 60%, #04010a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            perspective: 1000px;
            user-select: none;
        }

        /* Canvas Bintang & Efek Galaksi */
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Tombol Navigasi Bawah */
        .next-btn {
            position: fixed;
            bottom: 30px;
            z-index: 50;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.35), rgba(138, 43, 226, 0.35));
            border: 2px solid #ff69b4;
            color: #fff;
            padding: 13px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
            transition: all 0.3s ease;
            display: none;
        }
        .next-btn:hover {
            background: #ff69b4;
            color: #060210;
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 0 40px #ff69b4;
        }

        /* --- LAYAR 0: TOMBOL START --- */
        #start-screen {
            position: absolute;
            z-index: 30;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #start-btn {
            font-size: 1.9rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.3), rgba(138, 43, 226, 0.4));
            border: 3px solid #ff69b4;
            padding: 22px 52px;
            border-radius: 50px;
            text-shadow: 0 0 20px #ff69b4;
            box-shadow: 0 0 45px rgba(255, 105, 180, 0.7);
            backdrop-filter: blur(12px);
            animation: pulseBtn 1.5s infinite alternate;
        }
        @keyframes pulseBtn {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }

        /* --- HITUNG MUNDUR 3, 2, 1 --- */
        #countdown-screen {
            position: absolute;
            z-index: 25;
            display: none;
            font-size: 8.5rem;
            font-weight: bold;
            color: #ffb6c1;
            text-shadow: 0 0 30px #ff69b4, 0 0 70px #da70d6;
            animation: zoomCount 0.9s infinite;
        }
        @keyframes zoomCount {
            0% { transform: scale(0.4); opacity: 0; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* --- TAHAP 1: GALAKSI 3D ORBIT (FOTO UTAMA DIAM TENANG & ELEGAN) --- */
        #stage-1 {
            display: none;
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.8s ease;
        }

        .header-group {
            position: absolute;
            top: 28px;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }
        .neon-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #ffb6c1, #ff69b4, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.85));
            letter-spacing: 2px;
        }
        .neon-subtitle {
            font-size: 1rem;
            color: #e0b0ff;
            margin-top: 6px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #8a2be2;
        }

        .solar-system {
            position: relative;
            width: 580px;
            height: 580px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Foto Utama di Tengah (Stabil, Fokus, Tanpa Miring Aneh) */
        .center-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
        }

        .energy-ring-1 {
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ff69b4;
            border-bottom-color: #00ffff;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
            animation: spinRight 4s linear infinite;
        }
        .energy-ring-2 {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            border: 2px dashed rgba(218, 112, 214, 0.7);
            animation: spinLeft 8s linear infinite;
        }

        .center-planet {
            position: relative;
            width: 175px;
            height: 175px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 0 40px #ff69b4, 0 0 70px #8a2be2;
            animation: floatCenter 4s ease-in-out infinite alternate;
        }
        .center-planet img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes floatCenter {
            0% { transform: translateY(-5px); }
            100% { transform: translateY(5px); }
        }

        /* Jalur Orbit */
        .orbit-1 {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1.5px dashed rgba(255, 182, 193, 0.45);
            border-radius: 50%;
            animation: spinRight 16s linear infinite;
        }
        .orbit-2 {
            position: absolute;
            width: 520px;
            height: 520px;
            border: 1.5px solid rgba(186, 85, 211, 0.4);
            border-radius: 50%;
            animation: spinLeft 24s linear infinite;
        }

        .orbit-item {
            position: absolute;
            background: rgba(25, 8, 52, 0.85);
            border: 1.5px solid #ff69b4;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 0 18px rgba(255, 105, 180, 0.75);
            backdrop-filter: blur(6px);
        }

        /* Posisi item orbit dengan counter-rotation agar teks selalu tegak terbaca */
        .o1-item1 { top: -18px; left: 50%; transform: translateX(-50%); animation: spinLeft 16s linear infinite; }
        .o1-item2 { bottom: -18px; left: 50%; transform: translateX(-50%); animation: spinLeft 16s linear infinite; }

        .o2-item1 { top: 50%; left: -50px; transform: translateY(-50%); animation: spinRight 24s linear infinite; }
        .o2-item2 { top: 50%; right: -50px; transform: translateY(-50%); animation: spinRight 24s linear infinite; }
        .o2-item3 { top: -20px; left: 50%; transform: translateX(-50%); animation: spinRight 24s linear infinite; }
        .o2-item4 { bottom: -20px; left: 50%; transform: translateX(-50%); animation: spinRight 24s linear infinite; }

        .mini-photo {
            width: 52px;
            height: 52px;
            padding: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 2.5px solid #ffb6c1;
            box-shadow: 0 0 20px #ff69b4;
        }
        .mini-photo img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes spinRight { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinLeft { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        /* --- TAHAP 2: GALERI KENANGAN --- */
        #stage-2 {
            display: none;
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .gallery-grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 920px;
            padding: 20px;
        }
        .polaroid-card {
            background: rgba(35, 12, 70, 0.65);
            border: 2px solid rgba(255, 105, 180, 0.7);
            backdrop-filter: blur(12px);
            padding: 14px 14px 28px 14px;
            border-radius: 18px;
            width: 230px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 105, 180, 0.4);
            transition: all 0.4s ease;
            animation: floatCard 3.2s ease-in-out infinite alternate;
        }
        .polaroid-card:nth-child(1) { transform: rotate(-5deg); animation-delay: 0s; }
        .polaroid-card:nth-child(2) { transform: rotate(0deg) translateY(-12px); animation-delay: 0.6s; }
        .polaroid-card:nth-child(3) { transform: rotate(5deg); animation-delay: 1.2s; }

        .polaroid-card:hover {
            transform: scale(1.12) rotate(0deg) translateY(-8px) !important;
            z-index: 20;
            border-color: #fff;
            box-shadow: 0 0 45px #ff69b4;
        }
        .polaroid-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .polaroid-caption {
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff69b4;
        }
        @keyframes floatCard {
            from { margin-top: 0px; }
            to { margin-top: -12px; }
        }

        /* --- TAHAP 3: SURAT UCAPAN --- */
        #stage-3 {
            display: none;
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .letter-box {
            max-width: 620px;
            width: 92%;
            background: rgba(25, 8, 55, 0.78);
            border: 2px solid #ff69b4;
            border-radius: 28px;
            padding: 38px 34px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 60px rgba(255, 105, 180, 0.55), inset 0 0 30px rgba(138, 43, 226, 0.45);
            text-align: center;
        }
        .letter-header {
            font-size: 1.9rem;
            font-weight: bold;
            color: #ffb6c1;
            margin-bottom: 22px;
            text-shadow: 0 0 18px #ff69b4;
        }
        #typewriter-text {
            font-size: 1.08rem;
            line-height: 1.85;
            color: #f8efff;
            min-height: 180px;
            white-space: pre-line;
        }
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.15rem;
            background-color: #ff69b4;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>

    <!-- Layar Start -->
    <div id="start-screen" onclick="startCountdown()">
        <div id="start-btn">✨ START ✨</div>
    </div>

    <!-- Layar Hitung Mundur -->
    <div id="countdown-screen">3</div>

    <!-- TAHAP 1: GALAKSI ORBIT -->
    <div id="stage-1">
        <div class="header-group">
            <div class="neon-title">✨ Happy Birthday ✨</div>
            <div class="neon-subtitle">You Are My Whole Universe 💖</div>
        </div>

        <div class="solar-system">
            <!-- Foto Utama di Tengah (Stabil, Fokus, Elegan dengan Cincin Energi) -->
            <div class="center-wrapper">
                <div class="energy-ring-1"></div>
                <div class="energy-ring-2"></div>
                <div class="center-planet">
                    <img src="foto utama.jpeg" alt="Foto Utama">
                </div>
            </div>

            <!-- Orbit Dalam -->
            <div class="orbit-1">
                <div class="orbit-item o1-item1">💖 Happy Birthday</div>
                <div class="orbit-item o1-item2">🌟 Bahagia Selalu Ya</div>
            </div>

            <!-- Orbit Luar -->
            <div class="orbit-2">
                <div class="orbit-item o2-item1">🌸 Panjang Umur</div>
                <div class="orbit-item o2-item2">✨ Best Wishes For You</div>
                <div class="orbit-item mini-photo o2-item3"><img src="kenangan 1.jpeg" alt="Foto 1"></div>
                <div class="orbit-item mini-photo o2-item4"><img src="kenangan 2.jpeg" alt="Foto 2"></div>
            </div>
        </div>
    </div>

    <!-- TAHAP 2: GALERI POLAROID -->
    <div id="stage-2">
        <div class="header-group" style="position: relative; top: 0; margin-bottom: 25px;">
            <div class="neon-title">✨ Special Moments ✨</div>
            <div class="neon-subtitle">Our Beautiful Memories 📸</div>
        </div>
        <div class="gallery-grid">
            <div class="polaroid-card">
                <img src="kenangan1.jpeg" alt="Momen 1">
                <div class="polaroid-caption">✨ Always Shining ✨</div>
            </div>
            <div class="polaroid-card">
                <img src="kenangan 2.jpeg" alt="Momen 2">
                <div class="polaroid-caption">💖 Best Wishes For You</div>
            </div>
            <div class="polaroid-card">
                <img src="kenangan3.jpeg" alt="Momen 3">
                <div class="polaroid-caption">🌟 Keep Smiling!</div>
            </div>
        </div>
    </div>

    <!-- TAHAP 3: SURAT UCAPAN -->
    <div id="stage-3">
        <div class="letter-box">
            <div class="letter-header">💌 Pesan Spesial Buat Kamu</div>
            <div id="typewriter-text"></div>
        </div>
    </div>

    <!-- Tombol Pindah Variasi -->
    <button class="next-btn" id="next-btn" onclick="nextStage()">Lanjut Kejutan Berikutnya ✨</button>

    <script>
        let currentStage = 0;
        let enableFireworks = false;

        // Teks Surat Rapi Tanpa Kata Sayang Berlebihan
        const messageText = 
            "Selamat ulang tahun ya! 🎉💖\n\n" +
            "Semoga di tahun yang baru ini semua doa, harapan, dan cita-cita kamu satu per satu terwujud dengan baik.\n\n" +
            "Terima kasih sudah jadi pribadi yang hebat dan membawa banyak hal baik. Tetap sehat, ceria, dan bahagia terus ya.\n\n" +
            "Have a wonderful day! ✨🌸";

        function startCountdown() {
            const startScreen = document.getElementById('start-screen');
            const countdownScreen = document.getElementById('countdown-screen');

            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                countdownScreen.style.display = 'block';
                
                let count = 3;
                countdownScreen.innerText = count;

                let timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownScreen.innerText = count;
                    } else if (count === 0) {
                        countdownScreen.innerText = "💖";
                    } else {
                        clearInterval(timer);
                        countdownScreen.style.display = 'none';
                        showStage(1);
                    }
                }, 900);
            }, 500);
        }

        function showStage(stage) {
            currentStage = stage;
            const s1 = document.getElementById('stage-1');
            const s2 = document.getElementById('stage-2');
            const s3 = document.getElementById('stage-3');
            const nextBtn = document.getElementById('next-btn');

            s1.style.opacity = '0';
            s2.style.opacity = '0';
            s3.style.opacity = '0';

            setTimeout(() => {
                s1.style.display = 'none';
                s2.style.display = 'none';
                s3.style.display = 'none';

                if (stage === 1) {
                    s1.style.display = 'flex';
                    setTimeout(() => s1.style.opacity = '1', 50);
                    nextBtn.style.display = 'block';
                    nextBtn.innerText = "Lihat Galeri Foto 📸 ➔";
                } else if (stage === 2) {
                    s2.style.display = 'flex';
                    setTimeout(() => s2.style.opacity = '1', 50);
                    nextBtn.innerText = "Baca Surat Spesial 💌 ➔";
                } else if (stage === 3) {
                    s3.style.display = 'flex';
                    setTimeout(() => s3.style.opacity = '1', 50);
                    nextBtn.innerText = "Ulangi Dari Awal 🔄";
                    enableFireworks = true;
                    startTypewriter();
                }
            }, 500);
        }

        function nextStage() {
            if (currentStage === 1) {
                showStage(2);
            } else if (currentStage === 2) {
                showStage(3);
            } else {
                enableFireworks = false;
                showStage(1);
            }
        }

        let typeIndex = 0;
        function startTypewriter() {
            const container = document.getElementById('typewriter-text');
            container.innerHTML = "";
            typeIndex = 0;

            function typeChar() {
                if (typeIndex < messageText.length) {
                    container.innerHTML = messageText.substring(0, typeIndex + 1) + '<span class="cursor"></span>';
                    typeIndex++;
                    setTimeout(typeChar, 42);
                } else {
                    container.innerHTML = messageText + '<span class="cursor"></span>';
                }
            }
            typeChar();
        }

        // Canvas Bintang, Bintang Jatuh & Kembang Api
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let shootingStars = [];
        let fireworks = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#ffffff', '#ff69b4', '#da70d6', '#8a2be2', '#ffb6c1', '#00ffff'];

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.8 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.7;
                this.speedY = (Math.random() - 0.5) * 0.7;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random();
                this.alphaChange = (Math.random() * 0.02) + 0.005;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha += this.alphaChange;
                if (this.alpha <= 0.1 || this.alpha >= 1) this.alphaChange = -this.alphaChange;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.len = Math.random() * 90 + 50;
                this.speed = Math.random() * 11 + 8;
                this.size = Math.random() * 1.8 + 0.6;
                this.waitTime = new Date().getTime() + Math.random() * 2500 + 800;
                this.active = false;
            }
            update() {
                if (this.active) {
                    this.x -= this.speed;
                    this.y += this.speed;
                    if (this.x < 0 || this.y >= canvas.height) this.reset();
                } else {
                    if (new Date().getTime() > this.waitTime) this.active = true;
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 182, 193, 0.85)';
                ctx.lineWidth = this.size;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.len, this.y - this.len);
                ctx.stroke();
                ctx.restore();
            }
        }

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5.5 + 1.2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.6, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.6);
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 45; i++) {
                fireworks.push(new FireworkParticle(x, y, color));
            }
        }

        for (let i = 0; i < 190; i++) particles.push(new Star());
        for (let i = 0; i < 4; i++) shootingStars.push(new ShootingStar());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => { p.update(); p.draw(); });
            shootingStars.forEach(s => { s.update(); s.draw(); });

            if (enableFireworks && Math.random() < 0.05) {
                spawnFirework();
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].alpha <= 0) fireworks.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
